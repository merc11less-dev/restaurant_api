services:
  app:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./test_booking.db
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      target: test
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "ruff check app tests alembic && mypy app && pytest -q"]
